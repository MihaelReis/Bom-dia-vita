<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma Pergunta Especial</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#ffd6e7,#ffeef5);
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .flor{
      position:absolute;
      font-size:40px;
      animation:flutuar 5s ease-in-out infinite;
    }

    @keyframes flutuar{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-20px);}
    }

    .container{
      background:white;
      width:550px;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.2);
    }

    h2{
      color:#ff5a7a;
      margin-bottom:20px;
    }

    h1{
      color:#ff2e63;
      margin-bottom:20px;
    }

    p{
      font-size:22px;
      margin-bottom:35px;
    }

    .botoes{
      position:relative;
      height:120px;
    }

    button{
      border:none;
      padding:15px 35px;
      border-radius:12px;
      font-size:20px;
      cursor:pointer;
    }

    #sim{
      background:#4CAF50;
      color:white;
    }

    #nao{
      background:#e63946;
      color:white;
      position:absolute;
      left:300px;
    }

    #sim:hover{
      transform:scale(1.08);
    }
  </style>
</head>

<body>

<div class="flor" style="top:20px;left:30px;">🌸</div>
<div class="flor" style="top:80px;right:40px;">🌷</div>
<div class="flor" style="bottom:30px;left:50px;">🌼</div>
<div class="flor" style="bottom:40px;right:50px;">🌹</div>
<div class="flor" style="top:45%;left:5px;">🌺</div>
<div class="flor" style="top:55%;right:5px;">💐</div>

<div class="container">

  <h1>❤️ Emilly little fitness❤️</h1>

  <p>Me da uma chance?</p>

  <div class="botoes">
    <button id="sim">Sim ❤️</button>
    <button id="nao">Não 😅</button>
  </div>

</div>

<script>

  const nao = document.getElementById("nao");

  function fugir(){

    let largura = window.innerWidth - 120;
    let altura = window.innerHeight - 80;

    let x = Math.random()*largura;
    let y = Math.random()*altura;

    nao.style.position="fixed";
    nao.style.left=x+"px";
    nao.style.top=y+"px";
  }

  nao.addEventListener("mouseover", fugir);
  nao.addEventListener("click", fugir);

  document.getElementById("sim").onclick=function(){

    document.body.innerHTML=`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
background:linear-gradient(135deg,#ff9ecb,#ffdbe9);
font-family:Arial;
text-align:center;
">

<div style="font-size:70px;">🌸💐🌹🌷🌼</div>

<h1 style="font-size:55px;color:#fff;margin:30px;">
Talvez seja nessa vida ainda...
</h1>

<p style="font-size:30px;color:white;">
Chegou seu dia de sorte
</p>

<div style="font-size:70px;margin-top:30px;">
❤️🌸❤️🌸❤️
</div>

</div>
`;

  }

</script>

</body>
</html>
